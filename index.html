<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mwashiku Results System</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #0b5ed7;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      font-size: 22px;
      margin-bottom: 5px;
    }

    header p {
      font-size: 14px;
    }

    .container {
      padding: 20px;
      max-width: 1100px;
      margin: auto;
    }

    .welcome {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .welcome h2 {
      color: #0b5ed7;
      margin-bottom: 8px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      padding: 20px;
      text-align: center;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card h3 {
      font-size: 14px;
      color: #666;
      margin-bottom: 10px;
    }

    .card .number {
      font-size: 28px;
      font-weight: bold;
      color: #0b5ed7;
    }

    .menu-title {
      margin-bottom: 15px;
      color: #333;
    }

    .menu {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 15px;
    }

    .menu button {
      border: none;
      background: white;
      padding: 18px 10px;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      font-size: 15px;
    }

    .menu button:hover {
      background: #eaf2ff;
    }

    .performance {
      background: white;
      padding: 20px;
      border-radius: 12px;
      margin-top: 25px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .progress {
      background: #ddd;
      height: 18px;
      border-radius: 20px;
      overflow: hidden;
      margin-top: 10px;
    }

    .progress-bar {
      width: 78%;
      height: 100%;
      background: #0b5ed7;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>

<header>
  <h1>SHULE YA MSINGI MWASHIKU</h1>
  <p>RESULTS MANAGEMENT SYSTEM</p>
</header>

<div class="container">

  <div class="welcome">
    <h2>Dashboard</h2>
    <p>Karibu kwenye mfumo wa kuchakata na kuchanganua matokeo
